[package]
name = "vults-core"
description = "Pure domain: sessions, activities, alerts, island state"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
vults-protocol.workspace = true
serde.workspace = true
# The ledger's bindings: answers are matched to the exact request by SHA-256.
sha2 = "0.10"

[dev-dependencies]
serde_json.workspace = true
ts-rs = "12"
# Random input sequences against reduce's invariants (plan-zeca S4).
proptest = { version = "1", default-features = false, features = ["std"] }

[lints]
workspace = true
